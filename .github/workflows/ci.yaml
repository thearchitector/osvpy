name: CI

on:
    push:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    python:
        strategy:
            fail-fast: false
            matrix:
                python: ["3.13", "3.14", "3.14t"]
                platform: [ubuntu-latest, macos-14]
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go/go.mod
                  cache-dependency-path: go/go.sum

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python }}
            - uses: astral-sh/setup-uv@v9.0.0

            - name: Build source distribution and wheel
              run: uv build --python "$(command -v python)" --out-dir dist/unrepaired

            - name: Repair Linux wheel for PyPI
              if: runner.os == 'Linux'
              run: uvx --with patchelf auditwheel repair dist/unrepaired/*.whl --wheel-dir dist

            - name: Collect distributions
              run: |
                  cp dist/unrepaired/*.tar.gz dist/
                  if [ "$RUNNER_OS" = "macOS" ]; then
                      cp dist/unrepaired/*.whl dist/
                  fi

            - name: Validate distributions for publishing
              run: uv publish --dry-run dist/*.whl dist/*.tar.gz

            - name: Install wheel and test dependencies
              run: |
                  uv sync --locked --no-install-project --group dev --python "$(command -v python)"
                  uv pip install --no-deps dist/*.whl

            - name: Run Python unit tests
              run: uv run --no-sync pytest

    go:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go/go.mod
                  cache-dependency-path: go/go.sum

            - name: Run Go unit tests
              working-directory: go
              run: |
                  go mod vendor
                  git apply patches/*.patch
                  go test -mod=vendor -race ./...

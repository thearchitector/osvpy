name: CI

on:
    push:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go/go.mod
                  cache-dependency-path: go/go.sum

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version-file: "pyproject.toml"

            - name: Install uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true

            - name: Install dependencies
              run: |
                  uv sync --locked --group dev
                  uv pip install pytest-github-actions-annotate-failures

            - name: Run unit tests
              run: uv run --no-sync pytest -m 'not integration'

            - name: Run integration tests
              run: uv run --no-sync pytest -m integration

            # Standalone race detection is required even when Python tests pass;
            # a race-instrumented shared library cannot initialize on all hosts.
            - name: Run standalone Go race tests
              working-directory: go
              run: go test -mod=readonly -race ./...

            - name: Build source distribution and wheel
              run: uv build

repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.5
      hooks:
          - id: ruff-check
            args:
                - --fix
                - --exit-non-zero-on-fix
          - id: ruff-format
            types_or: [python, markdown]
    - repo: local
      hooks:
          - id: typecheck
            name: typecheck
            language: system
            # entry: uv run ty check . --fix
            entry: uv run mypy .
            types: [python]
            require_serial: true
            pass_filenames: false
    - repo: builtin
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-toml
          - id: mixed-line-ending
            args:
                - --fix=lf
